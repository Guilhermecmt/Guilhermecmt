<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Guilherme Macêdo · Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.5" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.85" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#orb1)"/>
    <rect width="1280" height="320" fill="url(#orb2)"/>

    <!-- waves -->
    <path fill="#ffffff" fill-opacity="0.08">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0 240 C 220 200 420 290 640 250 C 860 210 1060 280 1280 240 L1280 320 L0 320 Z;
                M0 250 C 220 290 420 210 640 245 C 860 280 1060 210 1280 250 L1280 320 L0 320 Z;
                M0 240 C 220 200 420 290 640 250 C 860 210 1060 280 1280 240 L1280 320 L0 320 Z"/>
    </path>
    <path fill="#ffffff" fill-opacity="0.10">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0 275 C 260 250 460 305 700 280 C 940 255 1100 300 1280 270 L1280 320 L0 320 Z;
                M0 280 C 260 305 460 255 700 278 C 940 300 1100 255 1280 282 L1280 320 L0 320 Z;
                M0 275 C 260 250 460 305 700 280 C 940 255 1100 300 1280 270 L1280 320 L0 320 Z"/>
    </path>

    <!-- code glyph -->
    <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" fill="#ffffff">
      <text x="1010" y="190" font-size="120" fill-opacity="0.16">&lt;/&gt;</text>
    </g>

    <text x="88" y="120" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Guilherme Macêdo</text>
    <text x="90" y="168" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#c7d2fe">Full-Stack Developer</text>
    <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="17" fill="#e0e7ff">
      <text x="90" y="212">from the database to the deploy</text>
    </g>
  </g>
</svg>
